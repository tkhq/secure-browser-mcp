# Builds the hosted broker image (Dockerfile) and, on a push to main, pushes
# it to Turnkey's internal registry as main-<sha>. Pull requests build only.
#
# This repo is public. The AWS role trusts only refs/heads/main of this repo,
# and the role ARN lives in a repository variable, so a fork's workflow run
# has neither. Never switch this to pull_request_target.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}

      - name: Log in to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Pick the image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "image=${REGISTRY}/tkhq/secure_browser_mcp:main-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "image=secure-browser-mcp:pr-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          provenance: false
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tag.outputs.image }}
