<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northlake Supply — Receipt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            1200px 600px at 80% -10%,
            #1e3a5f 0%,
            transparent 60%
          ),
          radial-gradient(
            900px 500px at -10% 110%,
            #14342b 0%,
            transparent 55%
          ),
          #0b1220;
        color: #e6edf6;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(17, 25, 40, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 44px 36px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #3ee6b8, #1eae88);
        display: grid;
        place-items: center;
        font-size: 30px;
        color: #06231b;
        font-weight: 800;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .sub {
        color: #93a4bc;
        font-size: 14px;
        margin-bottom: 26px;
      }
      .summary {
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(9, 14, 24, 0.5);
        padding: 16px;
        font-size: 14px;
      }
      .summary .line {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        color: #aab8cc;
      }
      .summary .line strong {
        color: #e6edf6;
      }
      .summary .total {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin-top: 8px;
        padding-top: 10px;
        font-weight: 700;
        color: #e6edf6;
      }
      .footnote {
        margin-top: 22px;
        font-size: 12px;
        color: #6d7f97;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="check">✓</div>
      <h1>Payment complete</h1>
      <p class="sub">Your demo order is confirmed. Nothing was charged.</p>
      <div class="summary">
        <div class="line">
          <span>Field Notes Kit — Demo Edition</span><strong>$9.99</strong>
        </div>
        <div class="line"><span>Shipping</span><strong>Free</strong></div>
        <div class="line total"><span>Total</span><span>$9.99</span></div>
      </div>
      <div class="footnote">
        Order NL-2026-0042 · Northlake Supply demo storefront
      </div>
    </main>
  </body>
</html>
