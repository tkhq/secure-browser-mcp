<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northlake Supply — Sign in</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            1200px 600px at 80% -10%,
            #1e3a5f 0%,
            transparent 60%
          ),
          radial-gradient(
            900px 500px at -10% 110%,
            #14342b 0%,
            transparent 55%
          ),
          #0b1220;
        color: #e6edf6;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: rgba(17, 25, 40, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }
      .brand .mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, #4f8cff, #2dd4a7);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #071018;
        font-size: 16px;
      }
      .brand .name {
        font-weight: 700;
        letter-spacing: 0.2px;
        font-size: 17px;
      }
      h1 {
        font-size: 22px;
        font-weight: 650;
        margin-bottom: 6px;
      }
      .sub {
        color: #93a4bc;
        font-size: 14px;
        margin-bottom: 26px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #aab8cc;
        margin: 0 0 6px 2px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 18px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(9, 14, 24, 0.9);
        color: #e6edf6;
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus {
        border-color: #4f8cff;
      }
      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f8cff, #3b6fe0);
        color: #fff;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .footnote {
        margin-top: 22px;
        text-align: center;
        font-size: 12px;
        color: #6d7f97;
      }
      .badge {
        display: inline-block;
        margin-top: 10px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.4px;
        color: #2dd4a7;
        border: 1px solid rgba(45, 212, 167, 0.4);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark">N</div>
        <div class="name">Northlake Supply</div>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue to your account.</p>
      <form id="login" action="/session" method="post">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          placeholder="you@example.com"
        />
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••••••"
        />
        <button type="submit">Sign in</button>
      </form>
      <div class="footnote">
        Demo storefront for secure-browser-mcp
        <br />
        <span class="badge">TEST ENVIRONMENT</span>
      </div>
    </main>
  </body>
</html>
